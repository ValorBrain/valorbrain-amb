name: readme-metrics

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # memory_bench.llm imports the Gemini client at package import time.
      - name: Install the one runtime dependency the tests import
        run: python3 -m pip install google-genai
      - name: README metrics and GatewayLLM unit tests
        run: python3 -m unittest discover -s tests -v
