name: readme-metrics

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README numbers match results/ and carry one metric per line
        run: python3 -m unittest discover -s tests -v
